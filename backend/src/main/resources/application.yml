spring:
  application:
    name: samosa-junction
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:samosa_junction}
    username: ${DB_USERNAME:samosa}
    password: ${DB_PASSWORD:samosa}
  flyway:
    enabled: true
    placeholder-replacement: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Samosa Junction
    phase: 14-recommendations
    description: Modular monolith food-ordering backend

samosa:
  assistant:
    open-router-api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    chat-model: ${OPENROUTER_CHAT_MODEL:openai/gpt-4o-mini}
    embedding-model: ${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
    max-tool-rounds: ${ASSISTANT_MAX_TOOL_ROUNDS:6}
    semantic-top-k: ${ASSISTANT_SEMANTIC_TOP_K:5}
  auth:
    reset-token-ttl: ${AUTH_RESET_TOKEN_TTL:30m}
    expose-reset-path: ${AUTH_EXPOSE_RESET_PATH:true}
    public-app-url: ${AUTH_PUBLIC_APP_URL:http://localhost:5173}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:5000}
    poller-enabled: ${OUTBOX_POLLER_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-32bytes-min-key!}
    expiration: ${JWT_EXPIRATION:24h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  cart:
    ttl: ${CART_TTL:7d}
    max-quantity: ${CART_MAX_QUANTITY:20}
    redis-key-prefix: "cart:user:"
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${KAFKA_TOPIC:samosa.domain-events}
  s3:
    enabled: ${S3_ENABLED:false}
    endpoint: ${S3_ENDPOINT:}
    presign-endpoint: ${S3_PRESIGN_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:samosa-junction}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
    presign-ttl: ${S3_PRESIGN_TTL:15m}
    max-file-bytes: ${S3_MAX_FILE_BYTES:5000000}
    max-complaint-images: ${S3_MAX_COMPLAINT_IMAGES:5}
    local-root: ${S3_LOCAL_ROOT:data/object-storage}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:8080}
    signing-key: ${S3_SIGNING_KEY:local-dev-object-signing-key-32b!}
